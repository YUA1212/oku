    if (a) e.preventDefault();               // 아임웹 페이지가 맨 위로 튀는 것 방지
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el) return;
    var fn = ACT[el.getAttribute('data-a')];
    if (fn) { e.preventDefault(); fn(el.getAttribute('data-v')); }
  }
  function onInput(e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (k) { st[k] = e.target.value; render(); }
  }
  function onKey(e) {
    if (e.key === 'Escape' && (st.loginOpen || st.langOpen || st.signupOpen || st.searchOpen)) set({ loginOpen: false, langOpen: false, signupOpen: false, searchOpen: false });
    if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-k') === 'couponInput') ACT.applyCoupon();
  }
  [root, ovRoot].forEach(function (r) { r.addEventListener('click', onClick); r.addEventListener('input', onInput); r.addEventListener('keydown', onKey); });

  /* ---------- 아임웹 섹션 여백 무시하고 전체폭 ---------- */
  function fit() {
    if (!CONFIG.fullWidth) return;
    host.style.width = ''; host.style.marginLeft = '';
    var r = host.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    host.style.width = vw + 'px'; host.style.marginLeft = (-r.left) + 'px'; host.style.maxWidth = 'none';
  }
  fit(); window.addEventListener('resize', fit);
  window.addEventListener('load', fit);

  render();
})();
</script>
